<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="theme-color" content="#16211B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Mis Finanzas</title>
<style>
  :root{
    --papel:#F3F5F1; --tarjeta:#FFFFFF; --tinta:#16211B; --tinta-suave:#5A6A61;
    --linea:#E2E7E0; --radio:16px; --oro:#C79A3B; --oro-claro:#E0B95C;
    --verde:#1F7A4D; --rojo:#B5452F;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,#F5F7F3 0%,#EEF1EC 100%);
    background-attachment:fixed;
    color:var(--tinta);
    padding:calc(14px + env(safe-area-inset-top)) 14px 130px;max-width:520px;margin:0 auto;
  }
  .num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  h2.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave);margin:18px 0 10px;display:flex;align-items:center;gap:7px}
  h2.sec::before{content:'';width:14px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,var(--oro),var(--oro-claro));flex-shrink:0}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .marca-app{display:flex;align-items:center;gap:10px}
  .marca-app svg{width:34px;height:34px;border-radius:9px;box-shadow:0 3px 8px rgba(22,33,27,.25);flex-shrink:0}
  header h1{font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;line-height:1.1}
  header h1 small{display:block;font-size:9px;font-weight:600;letter-spacing:.14em;color:var(--oro);text-transform:uppercase}
  .fx-chip{border:none;background:var(--tinta);color:#F3F5F1;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}

  .alerta{background:var(--verde);color:#fff;border-radius:var(--radio);padding:14px 15px;margin-bottom:12px;display:flex;align-items:center;gap:11px;box-shadow:0 4px 14px rgba(31,122,77,.3)}
  .alerta.dorada{background:linear-gradient(135deg,#A8802F,var(--oro));box-shadow:0 4px 14px rgba(199,154,59,.35)}
  .alerta.roja{background:var(--rojo);box-shadow:0 4px 14px rgba(181,69,47,.3)}
  .alerta .txt{flex:1;font-size:14px;font-weight:600;line-height:1.35}
  .alerta .txt small{display:block;font-weight:400;opacity:.85;font-size:12px}
  .alerta button{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

  .toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#F3F5F1;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 22px rgba(22,33,27,.35);opacity:0;transition:opacity .25s,transform .25s;z-index:30;pointer-events:none;max-width:88vw;text-align:center}
  .toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}

  .mes-nav{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px}
  .mes-nav button{width:34px;height:34px;border:none;border-radius:10px;background:var(--tarjeta);font-size:17px;box-shadow:0 1px 2px rgba(22,33,27,.08);cursor:pointer;color:var(--tinta)}
  .mes-nav span{font-size:14px;font-weight:600;min-width:120px;text-align:center;text-transform:capitalize}

  .balance{
    background:linear-gradient(150deg,#1B2A21 0%,#16211B 55%,#0F1712 100%);
    color:#F3F5F1;border-radius:20px;padding:19px;margin-bottom:12px;
    box-shadow:0 10px 26px rgba(22,33,27,.26);position:relative;overflow:hidden;
  }
  .balance::after{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(199,154,59,.15),transparent 70%)}
  .balance>*{position:relative;z-index:1}
  .balance .etiqueta{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
  .balance .monto{font-size:32px;font-weight:700;margin:4px 0 12px}
  .balance .fila{display:flex;justify-content:space-between;font-size:13px;padding-top:9px;border-top:1px solid rgba(243,245,241,.15)}

  .hero{
    background:linear-gradient(150deg,#1B2A21 0%,#16211B 55%,#0F1712 100%);
    color:#F3F5F1;border-radius:20px;padding:20px 18px;margin-bottom:12px;
    display:flex;align-items:center;gap:18px;
    box-shadow:0 10px 26px rgba(22,33,27,.28);
    position:relative;overflow:hidden;
  }
  .hero::after{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(199,154,59,.16),transparent 70%)}
  .anillo{position:relative;width:112px;height:112px;flex-shrink:0}
  .anillo svg{width:112px;height:112px;transform:rotate(-90deg)}
  .anillo .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .anillo .pctv{font-size:22px;font-weight:800;line-height:1}
  .anillo .pctl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin-top:3px}
  .hero .datos{flex:1;min-width:0;position:relative}
  .hero .etq{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
  .hero .disp{font-size:30px;font-weight:800;margin:3px 0 2px;letter-spacing:-.02em}
  .hero .de{font-size:12px;opacity:.7}
  .hero .mini{display:flex;gap:14px;margin-top:12px;padding-top:11px;border-top:1px solid rgba(243,245,241,.14)}
  .hero .mini div{font-size:11px;opacity:.75}
  .hero .mini b{display:block;font-size:13px;opacity:1;font-weight:700;margin-top:1px}

  .cascada .fila-c{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea)}
  .cascada .fila-c:last-of-type{border-bottom:none}
  .cascada .nom-c{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-width:104px}
  .cascada .pista{flex:1;height:9px;border-radius:5px;background:var(--linea);overflow:hidden}
  .cascada .pista div{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.22,1,.36,1)}
  .cascada .m-c{font-size:13px;font-weight:700;min-width:80px;text-align:right}
  .cascada .sub-c{font-size:10px;color:var(--tinta-suave);font-weight:500}
  .cascada .queda{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding:12px 13px;border-radius:12px;background:var(--papel)}
  .cascada .queda span{font-size:13px;font-weight:700}
  .cascada .queda b{font-size:19px;font-weight:800}

  .distro,.card{background:var(--tarjeta);border:1px solid rgba(22,33,27,.05);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:0 2px 10px rgba(22,33,27,.05)}
  .bg-linea{display:flex;justify-content:space-between;font-size:13px;padding:7px 0 7px 14px;color:var(--tinta)}
  .bg-linea .num{font-weight:600}
  .bg-sub{display:flex;justify-content:space-between;font-size:13px;font-weight:800;padding:9px 0;border-top:1.5px solid var(--tinta);margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .bg-cab{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-suave);padding:8px 0 3px}
  .bg-neto{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:13px 14px;border-radius:12px;background:linear-gradient(135deg,#1B2A21,#0F1712);color:#F3F5F1}
  .bg-neto span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .bg-neto b{font-size:20px;font-weight:800}
  .barra{display:flex;height:13px;border-radius:7px;overflow:hidden;background:var(--linea)}
  .barra div{height:100%}
  .leyenda{display:flex;flex-wrap:wrap;gap:7px 13px;margin-top:11px}
  .leyenda span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tinta-suave)}
  .punto{width:9px;height:9px;border-radius:50%;display:inline-block}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px}
  .cat{background:var(--tarjeta);border-radius:var(--radio);padding:13px;box-shadow:0 1px 3px rgba(22,33,27,.06);border-top:3px solid var(--linea);cursor:pointer}
  .cat .nombre{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-suave)}
  .cat .total{font-size:18px;font-weight:700;margin-top:5px}
  .cat .cuenta{font-size:11px;color:var(--tinta-suave);margin-top:2px}

  .mov,.rec{background:var(--tarjeta);border-radius:12px;padding:12px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px;box-shadow:0 1px 2px rgba(22,33,27,.05)}
  .mov .info,.rec .info{cursor:pointer}
  .marca{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .info{flex:1;min-width:0}
  .desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta-txt{font-size:11px;color:var(--tinta-suave);margin-top:1px}
  .monto-r{font-size:14px;font-weight:700;flex-shrink:0;text-align:right}
  .sub-r{font-size:10px;color:var(--tinta-suave);font-weight:400}
  .borrar{border:none;background:none;color:#C4CCC6;font-size:18px;padding:4px 2px;cursor:pointer;flex-shrink:0;font-family:inherit}
  .borrar.armado{color:#fff;background:var(--rojo);border-radius:8px;font-size:11px;font-weight:700;padding:6px 8px}
  .btn-mini.armado{background:var(--rojo);color:#fff;border-color:var(--rojo)}
  .vacio{text-align:center;color:var(--tinta-suave);font-size:13px;padding:22px 0}

  .dist-fila{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .dist-fila .nom{flex:1;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
  .dist-fila input{width:74px;padding:9px 10px;border:1px solid var(--linea);border-radius:10px;font-size:15px;text-align:right;background:var(--tarjeta);color:var(--tinta)}
  .dist-fila .modo{border:1px solid var(--linea);background:var(--papel);border-radius:8px;font-size:11px;font-weight:700;padding:8px 8px;cursor:pointer;color:var(--tinta);min-width:44px;font-family:inherit}
  .dist-fila .eq{font-size:11px;color:var(--tinta-suave);min-width:64px;text-align:right}
  .plan-real{margin-top:6px}
  .pr-fila{margin-bottom:10px}
  .pr-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .pr-top b{font-weight:600}
  .pr-barra{height:8px;border-radius:4px;background:var(--linea);overflow:hidden;position:relative}
  .pr-barra div{height:100%;border-radius:4px}

  .cta-inv{background:var(--tarjeta);border-radius:var(--radio);padding:15px;margin-bottom:9px;box-shadow:0 1px 3px rgba(22,33,27,.06);border-left:4px solid #2E5E8C}
  .cta-inv .top{display:flex;justify-content:space-between;align-items:baseline}
  .cta-inv .nom{font-size:14px;font-weight:700}
  .cta-inv .tot{font-size:17px;font-weight:700}
  .cta-inv .sub{font-size:11px;color:var(--tinta-suave);margin-top:3px;display:flex;justify-content:space-between}
  .cta-inv .btns{display:flex;gap:8px;margin-top:10px}
  .btn-mini{border:1px solid var(--linea);background:var(--tarjeta);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--tinta)}
  .btn-mini.oscuro{background:var(--tinta);color:#F3F5F1;border-color:var(--tinta)}
  .btn-mini.dorado{background:linear-gradient(135deg,var(--oro),var(--oro-claro));color:#16211B;border-color:transparent}
  .motor{border-left:4px solid var(--oro)}
  .senal{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--linea);font-size:13px}
  .senal:first-of-type{border-top:none}
  .senal .tk{font-weight:700;min-width:56px}
  .senal .tag{font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff}
  .senal .nt{flex:1;color:var(--tinta-suave);font-size:12px}
  .estado{font-size:11px;color:var(--tinta-suave);margin-top:8px}

  .fondo{background:var(--tarjeta);border-radius:var(--radio);padding:15px;margin-bottom:9px;box-shadow:0 1px 3px rgba(22,33,27,.06)}
  .fondo.listo{border:2px solid var(--verde)}
  .fondo.hecho{opacity:.75;border:1px dashed var(--linea)}
  .fondo .top{display:flex;align-items:center;gap:9px}
  .fondo .emoji{font-size:22px}
  .fondo .nom{font-size:14px;font-weight:700;flex:1}
  .fondo .tipo-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:6px;color:#fff}
  .fondo .prog{display:flex;justify-content:space-between;font-size:12px;color:var(--tinta-suave);margin-top:10px}
  .barra-meta{height:9px;border-radius:5px;background:var(--linea);overflow:hidden;margin-top:6px}
  .barra-meta div{height:100%;border-radius:5px;background:var(--verde);transition:width .4s ease}
  .fondo .pie{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
  .fondo .cuando{font-size:12px;font-weight:600}
  .listo-tag{background:var(--verde);color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px}
  .hecho-tag{background:var(--papel);color:var(--tinta-suave);font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px}

  .proj-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
  .kpi{background:var(--tarjeta);border-radius:12px;padding:12px 10px;box-shadow:0 1px 3px rgba(22,33,27,.06)}
  .kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-suave)}
  .kpi .v{font-size:15px;font-weight:700;margin-top:4px}
  svg{display:block;width:100%}
  .marca-app svg,.anillo svg{width:auto}
  .marca-app svg{width:34px}
  .anillo svg{width:112px}

  .tabs{position:fixed;bottom:0;left:0;right:0;background:var(--tarjeta);border-top:1px solid var(--linea);display:flex;max-width:520px;margin:0 auto;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;border:none;background:none;padding:9px 0 8px;font-size:10px;font-weight:600;color:var(--tinta-suave);cursor:pointer;font-family:inherit}
  .tabs .ic{display:block;font-size:17px;margin-bottom:2px;filter:grayscale(1);opacity:.55;transition:filter .2s,opacity .2s}
  .tabs button.activo .ic{filter:none;opacity:1}
  .tabs button.activo{color:var(--tinta)}
  .tabs button.activo::after{content:'';display:block;width:20px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--oro),var(--oro-claro));margin:4px auto 0}
  .pantalla{display:none}.pantalla.activa{display:block;animation:subir .28s ease}
  @keyframes subir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .fab{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#B8862F,var(--oro-claro));color:#16211B;border:none;border-radius:999px;padding:14px 26px;font-size:14px;font-weight:700;box-shadow:0 6px 18px rgba(184,134,47,.42);cursor:pointer;z-index:4;font-family:inherit}

  .velo{position:fixed;inset:0;background:rgba(22,33,27,.45);display:none;z-index:10}
  .velo.abierto{display:block}
  .hoja{position:fixed;left:0;right:0;bottom:0;background:var(--papel);z-index:11;border-radius:22px 22px 0 0;padding:20px 16px 28px;max-width:520px;margin:0 auto;transform:translateY(105%);transition:transform .28s ease;max-height:88vh;overflow-y:auto}
  .hoja.abierta{transform:translateY(0)}
  .hoja h3{font-size:16px;font-weight:700;margin-bottom:14px}
  .campo{margin-bottom:12px}
  .campo label{display:block;font-size:11px;font-weight:600;color:var(--tinta-suave);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
  .campo input,.campo select{width:100%;padding:12px 13px;border:1px solid var(--linea);border-radius:12px;font-size:16px;background:var(--tarjeta);color:var(--tinta);font-family:inherit;appearance:none}
  .campo input:focus,.campo select:focus{outline:2px solid var(--tinta);outline-offset:-1px}
  .fila2{display:flex;gap:9px}.fila2 .campo{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:8px 13px;border-radius:999px;border:1px solid var(--linea);background:var(--tarjeta);font-size:13px;font-weight:500;cursor:pointer;color:var(--tinta);font-family:inherit}
  .chip.activo{color:#fff;border-color:transparent}
  .seg{display:flex;background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
  .seg button{flex:1;border:none;background:none;padding:11px;font-size:14px;font-weight:600;color:var(--tinta-suave);cursor:pointer;font-family:inherit}
  .seg button.activo{background:var(--tinta);color:#F3F5F1}
  .acciones{display:flex;gap:10px;margin-top:14px}
  .acciones button{flex:1;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-guardar{background:var(--tinta);color:#F3F5F1}
  .btn-cancelar{background:var(--tarjeta);color:var(--tinta);border:1px solid var(--linea) !important}
  .nota{font-size:12px;color:var(--tinta-suave);line-height:1.45;margin-top:6px}
  .switch{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}
  .switch input{width:18px;height:18px}
  @media(prefers-reduced-motion:reduce){.hoja,.barra-meta div{transition:none}.pantalla.activa{animation:none}}
</style>
</head>
<body>

<header>
  <div class="marca-app">
    <svg viewBox="0 0 1024 1024" aria-hidden="true">
      <defs>
        <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#263B2E"/><stop offset=".55" stop-color="#16211B"/><stop offset="1" stop-color="#0C130F"/></linearGradient>
        <linearGradient id="lg-oro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#B8862F"/></linearGradient>
      </defs>
      <rect width="1024" height="1024" rx="200" fill="url(#lg-bg)"/>
      <rect x="272" y="536" width="124" height="196" rx="30" fill="url(#lg-oro)" opacity=".72"/>
      <rect x="450" y="440" width="124" height="292" rx="30" fill="url(#lg-oro)" opacity=".86"/>
      <rect x="628" y="316" width="124" height="416" rx="30" fill="url(#lg-oro)"/>
      <circle cx="300" cy="600" r="17" fill="#F6F1E4"/>
      <path d="M300 600 L512 470 L654 349" fill="none" stroke="#F6F1E4" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M700 310 L679 378 L630 320 Z" fill="#F6F1E4"/>
    </svg>
  </div>
  <h1>Mis Finanzas<small data-i18n="lema"></small></h1>
  <button class="fx-chip num" id="fxToggle">USD</button>
</header>

<div id="alertas"></div>
<div class="toast" id="toast"></div>

<!-- ================= MES ================= -->
<div class="pantalla activa" id="p-mes">
  <div class="mes-nav">
    <button id="mesAnt" aria-label="&lsaquo;">‹</button>
    <span id="mesLabel" class="num"></span>
    <button id="mesSig" aria-label="&rsaquo;">›</button>
  </div>
  <section class="hero">
    <div class="anillo">
      <svg viewBox="0 0 112 112" aria-hidden="true">
        <circle cx="56" cy="56" r="44" fill="none" stroke="rgba(243,245,241,.12)" stroke-width="11"/>
        <circle id="anilloProg" cx="56" cy="56" r="44" fill="none" stroke="#1F7A4D" stroke-width="11"
                stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"
                style="transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1),stroke .4s"/>
      </svg>
      <div class="centro"><span class="pctv num" id="anilloPct">—</span><span class="pctl" data-i18n="disponible"></span></div>
    </div>
    <div class="datos">
      <div class="etq" data-i18n="heroEtq"></div>

<script>
/* ============ almacenamiento con respaldo ============ */
const almacen = {
  async get(k){
    if(typeof window.storage!=='undefined'){
      try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; }
    }
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    if(typeof window.storage!=='undefined'){
      try{ await window.storage.set(k,v); return true; }catch(e){}
    }
    try{ localStorage.setItem(k,v); return true; }catch(e){ return false; }
  }
};

function armarBorrar(btn,cb){
  let armado=false, timer=null;

  btn.onclick=async e=>{
    e.stopPropagation();
    if(!armado){
      armado=true; btn.classList.add('armado'); btn.textContent=t('confirmar');
      timer=setTimeout(()=>{armado=false;btn.classList.remove('armado');btn.textContent=orig;},2600);

    }
    clearTimeout(timer); await cb();
  };
}

/* ---------- cálculos base ---------- */
function valorActual(a){
  const v=conv(a.valor||0,a.moneda||'USD');
  if(a.tipo!=='vehiculo' || !(a.dep>0) || !a.fecha) return v;
  const anios=Math.max(0,(Date.now()-new Date(a.fecha+'T12:00:00').getTime())/31557600000);
  return v*Math.pow(1-a.dep/100,anios);
}
function valorInmueble(i){
  const v=conv(i.valor||0,i.moneda||'USD');
  if(!(i.plus>0)||!i.fecha) return v;
  const anios=Math.max(0,(Date.now()-new Date(i.fecha+'T12:00:00').getTime())/31557600000);
  return v*Math.pow(1+i.plus/100,anios);
}
function pagoMensualHip(monto,tasa,anios){
  const n=anios*12; if(n<=0) return 0;
  const r=tasa/100/12;
  return r>0? monto*r/(1-Math.pow(1+r,-n)) : monto/n;
}
function saldoInsoluto(h){
  if(!h||!(h.monto>0)) return 0;
  const n=(h.anios||0)*12, r=(h.tasa||0)/100/12;
  const k=Math.min(n, Math.max(0, Math.floor((Date.now()-new Date((h.inicio||'2000-01-01')+'T12:00:00').getTime())/2629800000)));
  if(r===0) return Math.max(0, h.monto*(1-k/n));
  const P=pagoMensualHip(h.monto,h.tasa,h.anios);
  const f=Math.pow(1+r,k);
  return Math.max(0, h.monto*f - P*(f-1)/r);
}
function hipotecasSaldo(){ return D.inmuebles.reduce((s,i)=>s+(i.hip? conv(saldoInsoluto(i.hip), i.moneda||'USD'):0),0); }
function hipotecasPagos(){ return D.inmuebles.reduce((s,i)=>s+(i.hip? conv(pagoMensualHip(i.hip.monto,i.hip.tasa,i.hip.anios), i.moneda||'USD'):0),0); }
function pasivosTotal(){ return D.pasivos.reduce((s,p)=>s+conv(p.saldo||0,p.moneda||'USD'),0) + hipotecasSaldo(); }
function pagosDeuda(){ return D.pasivos.reduce((s,p)=>s+conv(p.pago||0,p.moneda||'USD'),0) + hipotecasPagos(); }
function netoRec(r){
  const c=CATS.find(x=>x.id===r.cat);
  let m=conv(r.monto,r.moneda||'USD');
  if(c.entrada && r.bruto) m=m*(1-(r.tax||0)/100);
  return c.entrada? m : -m;
}
function impuestoRec(r){
  const c=CATS.find(x=>x.id===r.cat);
  if(!c.entrada||!r.bruto) return 0;
  return conv(r.monto,r.moneda||'USD')*((r.tax||0)/100);
}
function negocioMensual(){
  return D.negocio.reduce((s,n)=>{
    const m=conv(n.monto,n.moneda||'USD');
    return s + (n.periodo==='anual'? m/12 : m);
  },0);
}
function flujoLibre(){
  const ing=D.rec.filter(r=>CATS.find(c=>c.id===r.cat).entrada).reduce((s,r)=>s+netoRec(r),0);
  let sal=-D.rec.filter(r=>!CATS.find(c=>c.id===r.cat).entrada).reduce((s,r)=>s+netoRec(r),0);
  if(D.cfg.negocioEnProj) sal+=negocioMensual();
  if(D.cfg.deudaEnProj) sal+=pagosDeuda();
  return {ing,sal,flujo:ing-sal};
}
function aporteMensualFondo(f,flujo){
  if(f.mensual>0) return conv(f.mensual,f.moneda||'USD');
  if(f.pct>0 && flujo>0) return flujo*f.pct/100;
  return 0;
}
function fondoCompleto(f){
  return f.objetivo>0 && conv(f.acumulado||0,f.moneda||'USD')>=conv(f.objetivo,f.moneda||'USD');
}
// monto asignado a una categoría según la distribución (en moneda de vista)
// modo 'pct' = % del ingreso; modo 'fijo' = monto fijo en d.mon; 'usd' (legado) = fijo en USD
function asignadoCat(catId, base){
  const d=D.cfg.dist[catId]; if(!d||!d.v) return 0;
  if(d.modo==='pct') return base*d.v/100;
  return conv(d.v, d.mon || 'USD');
}
// monto CON signo de un movimiento (retiros de ahorro restan)
const signoMov = m => conv(m.monto,m.moneda||'USD')*(m.retiro?-1:1);

function totalesMes(k){
  const ms=D.mov.filter(m=>m.fecha.slice(0,7)===k);
  const tot={}; CATS.forEach(c=>tot[c.id]=0);
  ms.forEach(m=>tot[m.cat]+=signoMov(m));
  return {ms,tot};
}
function renderMes(){
  document.getElementById('mesLabel').textContent=MESES_T()[mesActual.getMonth()]+' '+mesActual.getFullYear();
  const {ms,tot}=totalesMes(mesKey(mesActual));
  // el ahorro NO resta: es dinero apartado que sigue siendo tuyo
  const gastado=CATS.filter(c=>!c.entrada&&c.id!=='ahorro').reduce((s,c)=>s+tot[c.id],0);
  const apartado=tot.ahorro;
  const {ing:ingProy}=flujoLibre();
  const base = tot.ingresos>0? tot.ingresos : ingProy;
  const bal = base - gastado;

  document.getElementById('resIngresos').textContent=fmt(base)+(tot.ingresos>0?'':t('proyTag'));
  document.getElementById('resSalidas').textContent=fmt(gastado);
  document.getElementById('resApartado').textContent=fmt(apartado);
  const eb=document.getElementById('balanceTotal');
  eb.textContent=fmt2(bal); eb.style.color=bal<0?'#E8A398':'#F3F5F1';

  const pctDisp = base>0? Math.max(0,Math.min(100, bal/base*100)) : 0;
  const C=276.5, prog=document.getElementById('anilloProg');
  prog.style.strokeDashoffset = C - C*pctDisp/100;
  prog.style.stroke = pctDisp<15? '#B5452F' : pctDisp<35? '#C79A3B' : '#1F7A4D';
  document.getElementById('anilloPct').textContent = base>0? Math.round(pctDisp)+'%' : '—';

  const hoy=new Date(), rd=document.getElementById('ritmoDia');
  if(hoy.getFullYear()===mesActual.getFullYear() && hoy.getMonth()===mesActual.getMonth() && bal>0){
    const finMes=new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate();
    const diasRest=Math.max(1,finMes-hoy.getDate()+1);
    rd.textContent=fmt(bal/diasRest)+t('porDia');
  } else rd.textContent='—';

  const casc=document.getElementById('cascadaFilas'); casc.innerHTML='';
  const {ing:ingBase}=flujoLibre();
  CATS.filter(c=>!c.entrada).forEach(c=>{
    const monto=tot[c.id];
    const esAhorro=c.id==='ahorro';
    const pct=base>0? Math.min(100,Math.max(0,monto)/base*100):0;
    const asig=asignadoCat(c.id, ingBase);
    const sobre = !esAhorro && asig>0 && monto>asig;
    const fila=document.createElement('div'); fila.className='fila-c';
    fila.innerHTML='<span class="nom-c"><i class="punto" style="background:'+COLORES[c.id]+'"></i>'+(esAhorro?'🔒 ':'')+nomCat(c.id)+'</span>'+
      '<span class="pista"><div style="width:'+pct+'%;background:'+(sobre?'#B5452F':COLORES[c.id])+'"></div></span>'+
      '<span class="m-c num" style="color:'+(esAhorro?'#1F7A4D':(sobre?'#B5452F':'var(--tinta)'))+'">'+(esAhorro?'→ ':'−')+fmt(monto)+
      (esAhorro?'<br><span class="sub-c">'+t('apartadoSigue')+'</span>':(asig>0?'<br><span class="sub-c">'+t('deAsignado',fmt(asig))+(sobre?' ⚠️':'')+'</span>':''))+'</span>';
    casc.appendChild(fila);
  });
  const qf=document.getElementById('quedaFinal');
  qf.textContent=fmt2(bal); qf.style.color=bal<0?'#B5452F':'#1F7A4D';
  const notaAp=document.getElementById('quedaNota');
  notaAp.textContent = apartado>0? t('notaApartado',fmt(apartado)) : '';

  const grid=document.getElementById('gridCats'); grid.innerHTML='';
  CATS.forEach(c=>{
    const n=ms.filter(m=>m.cat===c.id).length;
    const d=document.createElement('div'); d.className='cat'; d.style.borderTopColor=COLORES[c.id];
    d.innerHTML='<div class="nombre">'+nomCat(c.id)+'</div><div class="total num">'+fmt(tot[c.id])+'</div><div class="cuenta">'+n+' '+t('nMovs')+'</div>';
    d.onclick=()=>{ if(c.id==='inversiones'){ abrirDestinoInv(); } else { catMov=c.id; abrirMov(); } };
    grid.appendChild(d);
  });

  const lista=document.getElementById('listaMovs'); lista.innerHTML='';
  if(!ms.length){ lista.innerHTML='<div class="vacio">'+t('sinMovs')+'</div>'; return; }
  ms.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).forEach(m=>{
    const c=CATS.find(x=>x.id===m.cat), mon=m.moneda||'USD';
    const esRetiro=!!m.retiro;
    const row=document.createElement('div'); row.className='mov';
    row.innerHTML='<span class="marca" style="background:'+COLORES[m.cat]+'"></span>'+
      '<div class="info"><div class="desc">'+escapar(m.desc||nomCat(m.cat))+'</div>'+
      '<div class="meta-txt">'+nomCat(m.cat)+(esRetiro?' · '+t('retiroTag'):'')+' · '+fFecha(m.fecha)+(mon!==D.cfg.moneda?' · '+mon:'')+'</div></div>'+
      '<span class="monto-r num" style="color:'+(c.entrada||esRetiro?COLORES.ingresos:'var(--tinta)')+'">'+(c.entrada?'+':(esRetiro?'↩ +':'−'))+' '+fmt2(conv(m.monto,mon))+'</span>';
    row.querySelector('.info').onclick=()=>abrirMovEditar(m);
    const del=document.createElement('button'); del.className='borrar'; del.textContent='×'; del.setAttribute('aria-label',t('eliminar'));
    armarBorrar(del,async()=>{ D.mov=D.mov.filter(x=>x.id!==m.id); await guardar(); renderTodo(); });
    row.appendChild(del); lista.appendChild(row);
  });
}

/* ---------- PLAN: distribución ---------- */
function renderDistribucion(){
  const {ing}=flujoLibre();
  document.getElementById('distBase').textContent=fmt(ing)+t('porMes');
  const cont=document.getElementById('distFilas'); cont.innerHTML='';
  let totalAsig=0;
  CATS.filter(c=>!c.entrada).forEach(c=>{
    const d0=D.cfg.dist[c.id]||{modo:'pct',v:0};
    const d={modo:d0.modo==='usd'?'fijo':d0.modo, v:d0.v, mon:d0.mon||(d0.modo==='usd'?'USD':(d0.mon||'USD'))};
    const asig=asignadoCat(c.id,ing); totalAsig+=asig;
    const fila=document.createElement('div'); fila.className='dist-fila';
    fila.innerHTML='<span class="nom"><i class="punto" style="background:'+COLORES[c.id]+'"></i>'+nomCat(c.id)+'</span>';
    const inp=document.createElement('input');
    inp.type='number'; inp.inputMode='decimal'; inp.min=0; inp.step=d.modo==='pct'?1:10;
    inp.value=d.v||''; inp.placeholder='0';
    inp.onchange=async e=>{ D.cfg.dist[c.id]={modo:d.modo,v:parseFloat(e.target.value)||0,mon:d.mon}; await guardar(); renderTodo(); };
    const modo=document.createElement('button'); modo.className='modo';
    modo.textContent = d.modo==='pct' ? '%' : d.mon;
    modo.onclick=async()=>{
      // ciclo: % → fijo USD → fijo MXN → %
      let nuevo;
      if(d.modo==='pct') nuevo={modo:'fijo',v:d.v,mon:'USD'};
      else if(d.mon==='USD') nuevo={modo:'fijo',v:d.v,mon:'MXN'};
      else nuevo={modo:'pct',v:d.v,mon:'USD'};
      D.cfg.dist[c.id]=nuevo; await guardar(); renderTodo();
    };
    const eq=document.createElement('span'); eq.className='eq num';
    eq.textContent = d.modo==='pct'? fmt(asig) : (ing>0? Math.round(asig/ing*100)+'%':'');
    fila.appendChild(inp); fila.appendChild(modo); fila.appendChild(eq);
    cont.appendChild(fila);
  });
  document.getElementById('distTotal').textContent=fmt(totalAsig)+(ing>0?' ('+Math.round(totalAsig/ing*100)+'%)':'');
  const resto=ing-totalAsig, er=document.getElementById('distResto');
  if(ing<=0) er.textContent=t('distSinIngreso');
  else if(resto<0) er.textContent=t('distSobre',fmt(-resto));
  else er.textContent=t('distSinAsignar',fmt(resto));

  const pr=document.getElementById('planReal'); pr.innerHTML='';
  const {tot}=totalesMes(mesKey(new Date()));
  let alguno=false;
  CATS.filter(c=>!c.entrada).forEach(c=>{
    const asig=asignadoCat(c.id,ing);
    if(asig<=0) return;
    alguno=true;
    const real=tot[c.id], pct=Math.min(100,Math.max(0,real)/asig*100);
    const sobre=real>asig;
    const fila=document.createElement('div'); fila.className='pr-fila';
    fila.innerHTML='<div class="pr-top"><b>'+nomCat(c.id)+'</b><span class="num">'+fmt(real)+' / '+fmt(asig)+(sobre?' ⚠️':'')+'</span></div>'+
      '<div class="pr-barra"><div style="width:'+pct+'%;background:'+(sobre?'#B5452F':COLORES[c.id])+'"></div></div>';
    pr.appendChild(fila);
  });
  if(!alguno) pr.innerHTML='<div class="vacio" style="padding:8px 0">'+t('planRealVacio')+'</div>';
}

function renderPlan(){
  renderDistribucion();
  const lista=document.getElementById('listaRec'); lista.innerHTML='';
  if(!D.rec.length){ lista.innerHTML='<div class="vacio">'+t('sinRec')+'</div>'; return; }
  D.rec.forEach(r=>{
    const c=CATS.find(x=>x.id===r.cat);
    const row=document.createElement('div'); row.className='rec';
    let sub=nomCat(r.cat)+' · '+(r.moneda||'USD')+t('porMes'), montoHtml;
    if(c.entrada&&r.bruto){
      montoHtml='<span class="monto-r num">'+fmt2(Math.abs(netoRec(r)))+'<br><span class="sub-r">'+t('netoImpTag',fmt(impuestoRec(r)))+'</span></span>';
      sub+=' · '+t('brutoTag',(r.tax||0));
    } else montoHtml='<span class="monto-r num">'+(c.entrada?'+':'−')+' '+fmt2(Math.abs(netoRec(r)))+'</span>';
    row.innerHTML='<span class="marca" style="background:'+COLORES[r.cat]+'"></span>'+
      '<div class="info"><div class="desc">'+escapar(r.nombre)+'</div><div class="meta-txt">'+sub+'</div></div>'+montoHtml;
    row.querySelector('.info').onclick=()=>abrirRecEditar(r);
    const del=document.createElement('button'); del.className='borrar'; del.textContent='×'; del.setAttribute('aria-label',t('eliminar'));
    armarBorrar(del,async()=>{ D.rec=D.rec.filter(x=>x.id!==r.id); await guardar(); renderTodo(); });
    row.appendChild(del); lista.appendChild(row);
  });
}

/* ---------- CARTERA ---------- */
function totalCuenta(cid){
  return D.aportes.filter(a=>a.cuentaId===cid).reduce((s,a)=>s+conv(a.monto,a.moneda||'USD'),0);
}
function renderCartera(){
  const total=D.cuentas.reduce((s,c)=>s+totalCuenta(c.id),0);
  const anio=new Date().getFullYear()+'';
  const totAnio=D.aportes.filter(a=>a.fecha.slice(0,4)===anio).reduce((s,a)=>s+conv(a.monto,a.moneda||'USD'),0);
  const liqBancos=D.bancos.reduce((s,b)=>s+conv(b.saldo||0,b.moneda||'USD'),0);
  const liqEfectivo=D.activos.filter(a=>a.tipo==='efectivo').reduce((s,a)=>s+valorActual(a),0);
  const bienes=D.activos.filter(a=>a.tipo!=='efectivo').reduce((s,a)=>s+valorActual(a),0);
  const inmuebles=D.inmuebles.reduce((s,i)=>s+valorInmueble(i),0);
  const activosTot=liqBancos+liqEfectivo+bienes+inmuebles+total;
  const pasTot=pasivosTotal();
  const neto=activosTot-pasTot;
  const patrimonio=activosTot;
  document.getElementById('patrimonioTotal').textContent=fmt2(neto);
  document.getElementById('patrimonioTotal').style.color = neto<0?'#E8A398':'#F3F5F1';
  document.getElementById('actTotal').textContent=fmt2(activosTot);
  document.getElementById('pasTotal').textContent='−'+fmt2(pasTot);
  document.getElementById('endeud').textContent = activosTot>0? Math.round(pasTot/activosTot*100)+t('deActivosTag') : '—';
  document.getElementById('liqBancos').textContent=fmt2(liqBancos);
  document.getElementById('liqEfectivo').textContent=fmt2(liqEfectivo);
  document.getElementById('carteraTotal').textContent=fmt2(total);
  document.getElementById('bienesTotal').textContent=fmt2(bienes);
  document.getElementById('inmTotal').textContent=fmt2(inmuebles);
  document.getElementById('bgAct').textContent=fmt2(activosTot);
  document.getElementById('bgPas').textContent=pasTot>0?'−'+fmt2(pasTot):fmt2(0);
  const bn=document.getElementById('bgNeto');
  bn.textContent=fmt2(neto); bn.style.color=neto<0?'#E8A398':'#F3F5F1';
  const bgp=document.getElementById('bgPasivos'); bgp.innerHTML='';
  if(!D.pasivos.length && !D.inmuebles.some(i=>i.hip&&i.hip.monto>0)){
    bgp.innerHTML='<div class="bg-linea"><span style="color:var(--tinta-suave)">'+t('sinDeudas')+'</span><span class="num">'+fmt2(0)+'</span></div>';
  }
  D.pasivos.forEach(p=>{
    const tp=TIPOS_PAS.find(x=>x.id===p.tipo)||TIPOS_PAS[4];
    const fila=document.createElement('div'); fila.className='bg-linea';
    fila.innerHTML='<span>'+tp.emoji+' '+escapar(p.nombre)+'</span><span class="num">−'+fmt2(conv(p.saldo||0,p.moneda||'USD'))+'</span>';
    bgp.appendChild(fila);
  });
  D.inmuebles.filter(i=>i.hip&&i.hip.monto>0).forEach(i=>{
    const fila=document.createElement('div'); fila.className='bg-linea';
    fila.innerHTML='<span>'+t('hipotecaLinea',escapar(i.nombre))+'</span><span class="num">−'+fmt2(conv(saldoInsoluto(i.hip),i.moneda||'USD'))+'</span>';
    bgp.appendChild(fila);
  });

  // clasificación: ahorro apartado / liquidez libre / invertido (con retiros ya descontados)
  const ahorroAcum=D.mov.filter(m=>m.cat==='ahorro').reduce((s,m)=>s+signoMov(m),0);
  const liqTotal=liqBancos+liqEfectivo;
  const liqLibre=liqTotal-ahorroAcum;
  const invertido=total;
  const baseClasif=Math.max(0,liqLibre)+Math.max(0,ahorroAcum)+invertido;
  const bc=document.getElementById('barraClasif'), lc=document.getElementById('leyendaClasif'), cf=document.getElementById('clasifFilas');
  bc.innerHTML=''; lc.innerHTML=''; cf.innerHTML='';
  [[t('clasifAhorro'),Math.max(0,ahorroAcum),'#C79A3B'],[t('clasifLibre'),Math.max(0,liqLibre),'#2E5E8C'],[t('clasifInv'),invertido,'#1F7A4D']]
  .forEach(([n,v,clr])=>{
    const pct=baseClasif>0? v/baseClasif*100:0;
    const seg=document.createElement('div'); seg.style.width=pct+'%'; seg.style.background=clr; bc.appendChild(seg);
    const li=document.createElement('span');
    li.innerHTML='<i class="punto" style="background:'+clr+'"></i>'+n+' '+(baseClasif>0?Math.round(pct)+'%':'—');
    lc.appendChild(li);
    const fila=document.createElement('div'); fila.className='pr-fila';
    fila.innerHTML='<div class="pr-top"><b>'+n+'</b><span class="num">'+fmt(v)+'</span></div>'+
      '<div class="pr-barra"><div style="width:'+pct+'%;background:'+clr+'"></div></div>';
    cf.appendChild(fila);
  });
  const cn=document.getElementById('clasifNota');
  if(liqLibre<0) cn.textContent=t('clasifNotaNeg',fmt(ahorroAcum),fmt(liqTotal));
  else cn.textContent=t('clasifNotaOk',fmt(liqLibre));

  // lista de inmuebles
  const linm=document.getElementById('listaInm'); linm.innerHTML='';
  if(!D.inmuebles.length){ linm.innerHTML='<div class="vacio">'+t('inmVacio')+'</div>'; }
  D.inmuebles.forEach(i=>{
    const va=valorInmueble(i);
    const compra=conv(i.valor||0,i.moneda||'USD');
    const gan=va-compra;
    const div=document.createElement('div'); div.className='cta-inv'; div.style.borderLeftColor='#2E7D7A';
    let filas='<div class="top"><span class="nom">🏘️ '+escapar(i.nombre)+'</span><span class="tot num">'+fmt2(va)+'</span></div>';
    let sub=(i.modo==='construccion'?t('construccionTag'):t('compraTag'))+' '+fmt(compra)+' · '+t('plusTag',(i.plus||0))+(gan>0.5?' · '+t('acumTag',fmt(gan)):'');
    filas+='<div class="sub"><span>'+sub+'</span></div>';
    if(i.hip&&i.hip.monto>0){
      const pago=conv(pagoMensualHip(i.hip.monto,i.hip.tasa,i.hip.anios),i.moneda||'USD');
      const insoluto=conv(saldoInsoluto(i.hip),i.moneda||'USD');
      const equity=va-insoluto;
      filas+='<div class="sub" style="margin-top:5px"><span>'+t('hipSub',i.hip.tasa,i.hip.anios,fmt(pago),fmt(insoluto))+'</span></div>';
      filas+='<div class="sub"><span style="color:#1F7A4D;font-weight:700">'+t('equitySub',fmt(equity),(va>0?Math.round(equity/va*100):0))+'</span></div>';
    }
    if(i.plus>0){
      const v5=va*Math.pow(1+i.plus/100,5), v10=va*Math.pow(1+i.plus/100,10);
      filas+='<div class="sub"><span>'+t('proyInmSub',fmt(v5),fmt(v10))+'</span></div>';
    }
    div.innerHTML=filas;
    const btns=document.createElement('div'); btns.className='btns';
    const bV=document.createElement('button'); bV.className='btn-mini oscuro'; bV.textContent=t('actualizarValor');
    bV.onclick=()=>{ inmSel=i; modoSaldo='inmueble'; document.getElementById('tituloSaldo').textContent=t('valorDe',i.nombre);
      document.getElementById('sSaldo').value=Math.round(va*100)/100; abrir('hojaSaldo'); };
    const bD=document.createElement('button'); bD.className='btn-mini'; bD.textContent=t('eliminar');
    armarBorrar(bD,async()=>{ D.inmuebles=D.inmuebles.filter(x=>x.id!==i.id); await guardar(); renderTodo(); });
    btns.appendChild(bV); btns.appendChild(bD); div.appendChild(btns);
    linm.appendChild(div);
  });
  document.getElementById('carteraAnio').textContent=fmt2(totAnio);

  // pasivos
  const lpas=document.getElementById('listaPasivos'); lpas.innerHTML='';
  if(!D.pasivos.length){ lpas.innerHTML='<div class="vacio">'+t('pasivosVacio')+'</div>'; }
  D.pasivos.forEach(p=>{
    const tp=TIPOS_PAS.find(x=>x.id===p.tipo)||TIPOS_PAS[4];
    const saldo=conv(p.saldo||0,p.moneda||'USD');
    const interesMes=p.tasa>0? saldo*(p.tasa/100)/12 : 0;
    const div=document.createElement('div'); div.className='cta-inv'; div.style.borderLeftColor=tp.color;
    let sub=[];
    if(p.tasa>0) sub.push(t('tasaSub',p.tasa,fmt(interesMes))+(p.tasa>=20?t('deudaCara'):''));
    if(p.pago>0) sub.push(t('pagoSub',fmt(conv(p.pago,p.moneda||'USD'))));
    div.innerHTML='<div class="top"><span class="nom">'+tp.emoji+' '+escapar(p.nombre)+'</span><span class="tot num" style="color:#B5452F">−'+fmt2(saldo)+'</span></div>'+
      '<div class="sub"><span>'+sub.join(' · ')+'</span></div>';
    const btns=document.createElement('div'); btns.className='btns';
    const bA=document.createElement('button'); bA.className='btn-mini oscuro'; bA.textContent=t('actualizarSaldo');
    bA.onclick=()=>{ pasivoSel=p; modoSaldo='pasivo'; document.getElementById('tituloSaldo').textContent=t('saldoDe',p.nombre);
      document.getElementById('sSaldo').value=p.saldo||''; abrir('hojaSaldo'); };
    const bD=document.createElement('button'); bD.className='btn-mini'; bD.textContent=t('eliminar');
    armarBorrar(bD,async()=>{ D.pasivos=D.pasivos.filter(x=>x.id!==p.id); await guardar(); renderTodo(); });
    btns.appendChild(bA); btns.appendChild(bD); div.appendChild(btns);
    lpas.appendChild(div);
  });

  // ¿dónde está mi dinero?
  const bp=document.getElementById('barraPatrimonio'), lp=document.getElementById('leyendaPatrimonio');
  bp.innerHTML=''; lp.innerHTML='';
  [[t('lgBancos'),liqBancos,'#2E5E8C'],[t('lgEfectivo'),liqEfectivo,'#1F7A4D'],[t('lgInversiones'),total,'#C79A3B'],[t('lgBienes'),bienes,'#B5452F'],[t('lgInmuebles'),inmuebles,'#2E7D7A']]
  .forEach(([n,v,clr])=>{
    const pct=patrimonio>0? v/patrimonio*100:0;
    const seg=document.createElement('div'); seg.style.width=pct+'%'; seg.style.background=clr; bp.appendChild(seg);
    const li=document.createElement('span');
    li.innerHTML='<i class="punto" style="background:'+clr+'"></i>'+n+' '+(patrimonio>0?Math.round(pct)+'%':'—');
    lp.appendChild(li);
  });

  // efectivo y bienes
  const lact=document.getElementById('listaActivos'); lact.innerHTML='';
  if(!D.activos.length){ lact.innerHTML='<div class="vacio">'+t('activosVacio')+'</div>'; }
  D.activos.forEach(a=>{
    const tp=TIPOS_PAT.find(x=>x.id===a.tipo)||TIPOS_PAT[2];
    const va=valorActual(a);
    const div=document.createElement('div'); div.className='cta-inv'; div.style.borderLeftColor=tp.color;
    let sub='';
    if(a.tipo==='vehiculo' && a.dep>0 && a.fecha){
      const compra=conv(a.valor||0,a.moneda||'USD');
      const perdido=compra-va;
      sub=t('depSub',fmt(compra),a.dep,fmt(perdido),fmt(va*(a.dep/100)/12));
    } else if(a.moneda!==D.cfg.moneda){ sub=a.moneda; }
    div.innerHTML='<div class="top"><span class="nom">'+tp.emoji+' '+escapar(a.nombre)+'</span><span class="tot num">'+fmt2(va)+'</span></div>'+
      '<div class="sub"><span>'+sub+'</span></div>';
    const btns=document.createElement('div'); btns.className='btns';
    if(a.tipo==='efectivo'){
      const bA=document.createElement('button'); bA.className='btn-mini oscuro'; bA.textContent=t('actualizarMonto');
      bA.onclick=()=>{ activoSel=a; document.getElementById('tituloSaldo').textContent=t('montoDe',a.nombre);
        document.getElementById('sSaldo').value=a.valor||''; modoSaldo='activo'; abrir('hojaSaldo'); };
      btns.appendChild(bA);
    }
    const bD=document.createElement('button'); bD.className='btn-mini'; bD.textContent=t('eliminar');
    armarBorrar(bD,async()=>{ D.activos=D.activos.filter(x=>x.id!==a.id); await guardar(); renderTodo(); });
    btns.appendChild(bD); div.appendChild(btns);
    lact.appendChild(div);
  });

  const lb=document.getElementById('listaBancos'); lb.innerHTML='';
  if(!D.bancos.length){ lb.innerHTML='<div class="vacio">'+t('bancosVacio')+'</div>'; }
  D.bancos.forEach(b=>{
    const div=document.createElement('div'); div.className='cta-inv'; div.style.borderLeftColor='#C79A3B';
    const f=b.actualizado? new Date(b.actualizado) : null;
    div.innerHTML='<div class="top"><span class="nom">🏦 '+escapar(b.nombre)+'</span><span class="tot num">'+fmt2(conv(b.saldo||0,b.moneda||'USD'))+'</span></div>'+
      '<div class="sub"><span>'+(b.moneda||'USD')+(f?' · '+t('actualizadoTag',f.toLocaleDateString(LOC(),{day:'numeric',month:'short'})):'')+'</span></div>';
    const btns=document.createElement('div'); btns.className='btns';
    const bA=document.createElement('button'); bA.className='btn-mini oscuro'; bA.textContent=t('actualizarSaldo');
    bA.onclick=()=>{ bancoSel=b; modoSaldo='banco'; document.getElementById('tituloSaldo').textContent=t('saldoDe',b.nombre);
      document.getElementById('sSaldo').value=b.saldo||''; abrir('hojaSaldo'); };
    const bD=document.createElement('button'); bD.className='btn-mini'; bD.textContent=t('eliminar');
    armarBorrar(bD,async()=>{ D.bancos=D.bancos.filter(x=>x.id!==b.id); await guardar(); renderTodo(); });
    btns.appendChild(bA); btns.appendChild(bD); div.appendChild(btns);
    lb.appendChild(div);
  });

  const barra=document.getElementById('barraCartera'), ley=document.getElementById('leyendaCartera');
  barra.innerHTML=''; ley.innerHTML='';

  const la=document.getElementById('listaAportes'); la.innerHTML='';
  const ult=D.aportes.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,8);
  if(!ult.length){ la.innerHTML='<div class="vacio">'+t('primeraAportacion')+'</div>'; return; }

    const ta=TIPOS_ACTIVO.find(x=>x.id===(a.tipo||'otro'))||TIPOS_ACTIVO[3];
    let extra='';
    if((a.tipo||'')==='deuda' && a.tasa>0 && a.plazo>0){
      const rend=conv(a.monto,a.moneda||'USD')*(a.tasa/100)*(a.plazo/360);
      const venc=new Date(a.fecha+'T12:00:00'); venc.setDate(venc.getDate()+a.plazo);
      const vencido = venc<=new Date();
      extra=' · '+a.tasa+'% · '+a.plazo+'d → +'+fmt(rend)+(vencido?t('vencioTag'):t('venceTag'))+venc.toLocaleDateString(LOC(),{day:'numeric',month:'short'});

    row.appendChild(del); la.appendChild(row);
  });
}

/* ---------- MOTOR CUANTITATIVO ---------- */
async function actualizarMotor(){
  const est=document.getElementById('motorEstado');
  const cont=document.getElementById('senales');
  const url=document.getElementById('cfgApi').value.trim();
  if(url!==D.cfg.apiUrl){ D.cfg.apiUrl=url; await guardar(); }
  if(!url){ est.textContent=t('motorHint'); est.dataset.hint='1'; return; }
  est.dataset.hint='';
  est.textContent=t('motorConsultando');
  try{
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    cont.innerHTML='';
    const senales = Array.isArray(data)? data : (data.senales||data.signals||[]);
    if(!senales.length){ est.textContent=t('motorSinSenales'); return; }
    senales.slice(0,10).forEach(s=>{
      const div=document.createElement('div'); div.className='senal';
      const tipo=(s.senal||s.signal||'').toLowerCase();
      const clr = tipo.includes('compra')||tipo.includes('buy')? '#1F7A4D' : tipo.includes('venta')||tipo.includes('sell')? '#B5452F' : '#5A6A61';
      div.innerHTML='<span class="tk num">'+escapar(s.ticker||s.symbol||'—')+'</span>'+
        '<span class="tag" style="background:'+clr+'">'+escapar(s.senal||s.signal||'info')+'</span>'+
        '<span class="nt">'+escapar(s.nota||s.note||s.mensaje||'')+'</span>';
      cont.appendChild(div);
    });
    est.textContent=t('motorConectado')+' · '+(data.actualizado||data.updated||new Date().toLocaleTimeString(LOC()));
  }catch(e){
    est.textContent=t('motorError',e.message);
  }
}

/* ---------- FONDOS ---------- */
function renderFondos(){
  const {flujo}=flujoLibre();
  const ah=D.mov.filter(m=>m.cat==='ahorro');
  const totalAh=ah.reduce((s,m)=>s+signoMov(m),0);
  const kAhora=mesKey(new Date());
  const ahMes=ah.filter(m=>m.fecha.slice(0,7)===kAhora).reduce((s,m)=>s+signoMov(m),0);
  document.getElementById('ahorroTotal').textContent=fmt2(totalAh);
  document.getElementById('ahorroMes').textContent=fmt2(ahMes);
  const la=document.getElementById('listaAhorro'); la.innerHTML='';
  if(!ah.length){ la.innerHTML='<div class="vacio">'+t('ahorroVacio')+'</div>'; }
  else {
    const grupos={};
    ah.forEach(m=>{
      const clave=(m.desc||t('sinDesc')).trim();
      const k=clave.toLowerCase();
      if(!grupos[k]) grupos[k]={nombre:clave,total:0,n:0,desde:m.fecha};
      grupos[k].total+=signoMov(m);
      grupos[k].n++;
      if(m.fecha<grupos[k].desde) grupos[k].desde=m.fecha;
    });
    Object.values(grupos).sort((a,b)=>b.total-a.total).forEach(g=>{
      const pct=totalAh>0? Math.max(0,g.total)/totalAh*100:0;
      const fila=document.createElement('div'); fila.className='pr-fila';
      fila.innerHTML='<div class="pr-top"><b>🔒 '+escapar(g.nombre)+'</b><span class="num">'+fmt(g.total)+' · '+Math.round(pct)+'%</span></div>'+
        '<div class="pr-barra"><div style="width:'+pct+'%;background:#C79A3B"></div></div>'+
        '<div class="sub-c" style="font-size:10px;color:var(--tinta-suave);margin-top:3px">'+t('aportesDesde',g.n,fFecha(g.desde,{month:'short',year:'numeric'}))+'</div>';
      la.appendChild(fila);
    });
  }
  const totalMes=D.fondos.filter(f=>!f.realizado&&!fondoCompleto(f)).reduce((s,f)=>s+aporteMensualFondo(f,flujo),0);
  document.getElementById('fondosMensual').textContent=fmt(totalMes)+t('porMes');
  const pctFlujo=flujo>0? Math.round(totalMes/flujo*100):0;
  document.getElementById('fondosNota').textContent = flujo>0
    ? t('fondosNotaOk',pctFlujo,fmt(flujo))
    : t('fondosNotaSin');

  const lista=document.getElementById('listaFondos'); lista.innerHTML='';
  if(!D.fondos.length){ lista.innerHTML='<div class="vacio">'+t('fondosVacio')+'</div>'; return; }
  const orden=D.fondos.slice().sort((a,b)=>(a.realizado?1:0)-(b.realizado?1:0));
  orden.forEach(f=>{
    const tf=TIPOS_FONDO.find(x=>x.id===f.tipo)||TIPOS_FONDO[3];
    const obj=conv(f.objetivo,f.moneda||'USD'), ya=conv(f.acumulado||0,f.moneda||'USD');
    const pct=obj>0? Math.min(100,ya/obj*100):0;
    const completo=fondoCompleto(f);
    const ap=aporteMensualFondo(f,flujo);
    let cuando='';
    if(!completo&&!f.realizado){
      if(ap>0){
        const meses=Math.ceil((obj-ya)/ap);
        const fx=new Date(); fx.setMonth(fx.getMonth()+meses);
        cuando=t('ritmoFecha',meses,MESES_T()[fx.getMonth()]+' '+fx.getFullYear());
      } else cuando=t('asignaPct');
    }
    const div=document.createElement('div'); div.className='fondo'+(f.realizado?' hecho':(completo?' listo':''));
    div.innerHTML='<div class="top"><span class="emoji">'+tf.emoji+'</span>'+
      '<span class="nom">'+escapar(f.nombre)+'</span>'+
      '<span class="tipo-tag" style="background:'+tf.color+'">'+t('tf_'+tf.id)+'</span></div>'+
      '<div class="prog"><span class="num">'+fmt(ya)+' '+t('de')+' '+fmt(obj)+'</span><span>'+Math.round(pct)+'%'+(f.pct>0?' · '+f.pct+t('delFlujo'):'')+(f.mensual>0?' · '+fmt(conv(f.mensual,f.moneda||'USD'))+t('porMes'):'')+'</span></div>'+
      '<div class="barra-meta"><div style="width:'+pct+'%;background:'+(completo?'#1F7A4D':tf.color)+'"></div></div>';
    const pie=document.createElement('div'); pie.className='pie';
    if(f.realizado){
      const tag=document.createElement('span'); tag.className='hecho-tag'; tag.textContent=t('realizadoTag'); pie.appendChild(tag);
    } else if(completo){
      const tag=document.createElement('span'); tag.className='listo-tag'; tag.textContent=t('listoRealizar');
      pie.appendChild(tag);
    } else {
      const cu=document.createElement('span'); cu.className='cuando'; cu.textContent=cuando; pie.appendChild(cu);
    }
    const btns=document.createElement('div'); btns.style.display='flex'; btns.style.gap='7px';
    if(!f.realizado&&completo){
      const bR=document.createElement('button'); bR.className='btn-mini dorado'; bR.textContent=t('realizarBtn');
      bR.onclick=async()=>{
        const montoTxt=fmt2(ya);
        if(!confirm(t('realizarConfirm',montoTxt))) return;
        D.mov.push({id:uid()+'r',cat:'ahorro',retiro:true,monto:Math.round((f.acumulado||0)*100)/100,moneda:f.moneda||'USD',
          desc:t('fondoRealizadoDesc',f.nombre),fecha:hoyISO()});
        f.realizado=true; f.realizadoFecha=hoyISO();
        await guardar(); renderTodo();
      };
      btns.appendChild(bR);
    }
    if(!f.realizado&&!completo){
      const bA=document.createElement('button'); bA.className='btn-mini oscuro'; bA.textContent=t('aportarMini');
      bA.onclick=()=>{ fondoAporte=f; abrirAporteFondo(ap); };
      btns.appendChild(bA);
    }
    const bD=document.createElement('button'); bD.className='btn-mini'; bD.textContent='×'; bD.setAttribute('aria-label',t('eliminar'));
    armarBorrar(bD,async()=>{ D.fondos=D.fondos.filter(x=>x.id!==f.id); await guardar(); renderTodo(); });
    btns.appendChild(bD); pie.appendChild(btns); div.appendChild(pie);
    lista.appendChild(div);
  });
}

/* ---------- PROYECCIÓN ---------- */
function renderProj(){
  const {ing,sal,flujo}=flujoLibre();
  const imp=D.rec.reduce((s,r)=>s+impuestoRec(r),0);
  document.getElementById('kIngreso').textContent=fmt(ing);
  document.getElementById('kSalidas').textContent=fmt(sal);
  const kf=document.getElementById('kFlujo');
  kf.textContent=fmt(flujo); kf.style.color=flujo<0?'#B5452F':'#1F7A4D';
  document.getElementById('acum12').textContent=fmt(flujo*12);
  let nota = imp>0? t('notaImpTxt',fmt(imp),fmt(imp*12)) : '';
  if(D.cfg.negocioEnProj && negocioMensual()>0) nota+=t('notaNegTxt',fmt(negocioMensual()));
  if(D.cfg.deudaEnProj && pagosDeuda()>0) nota+=t('notaDeudaTxt',fmt(pagosDeuda()));
  document.getElementById('notaImp').textContent=nota||t('notaImpVacia');

  const W=460,H=150,P=6;
  let html='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+t('chartAria')+'">';
  const vals=[]; for(let i=1;i<=12;i++) vals.push(flujo*i);
  const max=Math.max(...vals.map(Math.abs),1);
  const bw=(W-P*2)/12-6;
  vals.forEach((v,i)=>{
    const h=Math.max(3,Math.abs(v)/max*(H-30));
    const x=P+i*((W-P*2)/12)+3;
    const y=v>=0? H-20-h : H-20;
    html+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+(v>=0?'#1F7A4D':'#B5452F')+'" opacity="'+(0.45+0.55*(i+1)/12)+'"/>';
    const hoy=new Date(), mm=(hoy.getMonth()+i)%12;
    if(i%2===1) html+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" fill="#5A6A61">'+MESES_T()[mm].slice(0,3)+'</text>';
  });
  html+='</svg>';
  document.getElementById('chart').innerHTML=html;
}

function ajustaDeuda(){
  document.getElementById('aDeudaWrap').style.display = tipoActivoSel==='deuda'?'block':'none';

function calcRendimiento(){
  const el=document.getElementById('aRendimiento');
  const m=parseFloat(document.getElementById('aMonto').value)||0;
  const tt=parseFloat(document.getElementById('aTasa').value)||0;
  const p=parseFloat(document.getElementById('aPlazo').value)||0;
  if(m>0&&tt>0&&p>0){
    const mon=document.querySelector('#aMoneda .activo').dataset.v;
    const rend=m*(tt/100)*(p/360);
    const venc=new Date(); venc.setDate(venc.getDate()+p);
    el.textContent=t('rendEst',rend.toLocaleString(LOC(),{style:'currency',currency:mon}),venc.toLocaleDateString(LOC(),{day:'numeric',month:'long'}));
  } else el.textContent=t('capturaTasa');
}
['aMonto','aTasa','aPlazo'].forEach(i=>document.getElementById(i).addEventListener('input',calcRendimiento));

/* CSV */
function csvCampo(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function descargarArchivo(nombre,contenido,tipo){
  const blob=new Blob([contenido],{type:tipo});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=nombre;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
document.getElementById('btnCsv').onclick=()=>{
  let filas=[['tipo','fecha','categoria','descripcion','monto','moneda']];
  D.mov.forEach(m=>filas.push(['movimiento',m.fecha,m.cat,m.desc||'',(m.retiro?-m.monto:m.monto),m.moneda||'USD']));
  D.aportes.forEach(a=>{
    const c=D.cuentas.find(x=>x.id===a.cuentaId);
    filas.push(['aportacion',a.fecha,(a.tipo||'otro'),(a.nombre||'')+' @ '+(c?c.nombre:'cuenta'),a.monto,a.moneda||'USD']);
  });
  D.fondos.forEach(f=>filas.push(['fondo','', 'fondos', f.nombre+' ('+f.tipo+')'+(f.realizado?' [realizado]':''), f.acumulado||0, f.moneda||'USD']));
  D.bancos.forEach(b=>filas.push(['banco','','liquidez',b.nombre,b.saldo||0,b.moneda||'USD']));
  D.activos.forEach(a=>filas.push(['activo',a.fecha||'',a.tipo,a.nombre,Math.round(valorActual(a)*100)/100,D.cfg.moneda]));
  D.pasivos.forEach(p=>filas.push(['pasivo','',p.tipo,p.nombre,-(p.saldo||0),p.moneda||'USD']));
  D.inmuebles.forEach(i=>{
    filas.push(['inmueble',i.fecha||'',i.modo||'compra',i.nombre,Math.round(valorInmueble(i)*100)/100,D.cfg.moneda]);
    if(i.hip&&i.hip.monto>0) filas.push(['hipoteca',i.hip.inicio||'','hipoteca',i.nombre,-Math.round(saldoInsoluto(i.hip)*100)/100,i.moneda||'USD']);
  });
  const csv='﻿'+filas.map(r=>r.map(csvCampo).join(',')).join('\n');
  descargarArchivo('mis-finanzas-'+hoyISO()+'.csv',csv,'text/csv;charset=utf-8');
};

document.getElementById('fileRestaurar').onchange=async e=>{
  const file=e.target.files[0]; e.target.value='';
  if(!file) return;
  try{
    const txt=await file.text();
    const j=JSON.parse(txt);
    const datos = (j&&j.app==='mis-finanzas'&&j.datos)? j.datos : j;
    if(!datos||typeof datos!=='object'||!datos.cfg||!Array.isArray(datos.mov)) throw new Error('formato');
    if(!confirm(t('restaurarConfirm'))) return;
    D=datos;
    ['mov','rec','metas','cuentas','aportes','fondos','negocio','bancos','activos','pasivos','inmuebles'].forEach(k=>{ if(!Array.isArray(D[k])) D[k]=[]; });
    D.cfg={fx:18.5,moneda:'USD',tax:15,apiUrl:'',lang:'es',negocioEnProj:true,deudaEnProj:true,dist:{},...(D.cfg||{})};
    LANG=(D.cfg.lang==='en')?'en':'es';
    await guardar();
    document.getElementById('cfgFx').value=D.cfg.fx;
    document.getElementById('cfgTax').value=D.cfg.tax;
    document.getElementById('cfgApi').value=D.cfg.apiUrl||'';
    document.getElementById('negProj').checked=!!D.cfg.negocioEnProj;
    document.getElementById('deudaProj').checked=!!D.cfg.deudaEnProj;
    aplicarIdioma(); renderTodo();
    notificar(t('restaurarOk'));
  }catch(err){ notificar(t('restaurarErr'),true); }
};
